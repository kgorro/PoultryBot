# PoultryBot on one VPS.
#   docker compose up -d                      bot + local LLM, bot on http://<server>:8000
#   docker compose --profile https up -d      also Caddy with automatic HTTPS for DOMAIN (ports 80, 443)
# Settings come from .env (copy .env.example).

services:
  poultrybot:
    build: .
    image: poultrybot:latest
    restart: unless-stopped
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
      DALAN_EPS: ${DALAN_EPS:-0.05}
      FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN:-}
      FB_PAGE_TOKEN: ${FB_PAGE_TOKEN:-}
    volumes:
      - botdata:/data            # saved LLM answers survive restarts and rebuilds
    ports:
      - "${BOT_PORT:-8000}:8000"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama     # downloaded models
    # Not published to the internet; only the bot talks to it.

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - poultrybot

volumes:
  botdata:
  ollama:
  caddy:
